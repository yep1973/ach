# Netlify 静态站点配置
# 本仓库根目录即站点根（index.html 在顶层），无需构建步骤。
[build]
  publish = "."
  # 纯静态站，无构建命令；如需将来加构建可在此补充。

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 说明：本站为多页面纯静态站（/index.html 与 /fun/index.html），
# 不是单页应用，因此不设置 /* -> /index.html 的 SPA 兜底重定向。
# 该兜底会把不存在的 JS/CSS 等资源也伪装成首页返回 200，掩盖真实 404。

# 历史游乐园存档 API：前端请求 /api/*，由 Netlify Functions 处理，
# 数据落在 Netlify Blobs（按游戏账号为键），实现手机 / 电脑同账号进度一致。
[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200

[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200
